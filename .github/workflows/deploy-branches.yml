name: Deploy by Branch

on:
  push:
    branches:
      - main
      - gamin-anime-version

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm install
      
      - name: Determine deployment path
        id: deploy-path
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "base_path=" >> $GITHUB_OUTPUT
            echo "deploy_subdir=" >> $GITHUB_OUTPUT
          else
            echo "base_path=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "deploy_subdir=$BRANCH_NAME/" >> $GITHUB_OUTPUT
          fi
      
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.deploy-path.outputs.base_path }}
      
      - name: Prepare deployment files
        run: |
          mkdir -p deploy/${{ steps.deploy-path.outputs.deploy_subdir }}
          cp -r dist/* deploy/${{ steps.deploy-path.outputs.deploy_subdir }}
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: false
          keep_files: true
