name: Deploy by Branch

on:
  push:
    branches:
      - main
      - gamin-anime-version

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Create deployment structure
        run: |
          mkdir -p deploy
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Deploying main branch to /prod"
            mkdir -p deploy/prod
            cp -r dist/* deploy/prod/
          elif [ "${{ github.ref }}" = "refs/heads/gamin-anime-version" ]; then
            echo "Deploying gamin-anime-version branch to /gamin-anime-version"
            mkdir -p deploy/gamin-anime-version
            cp -r dist/* deploy/gamin-anime-version/
          fi
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: false
